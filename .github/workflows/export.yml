name: Eksport

# Cały zbiór w jednym pliku: JSON Lines jako załącznik wydania „dane” i Parquet w zbiorze na Hugging Face.
# Osobno od „Metadanych”, żeby błąd eksportu nie psuł aktualizacji; uruchamiany po każdym udanym runie „Metadane”.
on:
  workflow_run:
    workflows: ["Metadane"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  NAME: ${{ github.event.repository.name }}

jobs:
  export:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Run „Metadane” bez commita nie zmienia zbioru.
      - name: Czy są nowe dane
        id: new
        run: echo "run=$([ "${{ github.event.workflow_run.head_sha }}" = "$(git rev-parse HEAD)" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.new.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Plik JSON Lines
        if: steps.new.outputs.run == 'true'
        run: python .github/export.py "$NAME.jsonl.gz"
      - name: Załącznik wydania „dane”
        if: steps.new.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dane >/dev/null 2>&1 || gh release create dane --latest \
            --title "Cały zbiór w jednym pliku" \
            --notes "Plik .jsonl.gz: jeden akt w wierszu (kolumny index.csv, meta = front matter, markdown, tree = drzewo jednostek). Odświeżany przez workflow Eksport po zmianie metadanych; tag nie oznacza wersji danych, wersja konwertera jest w polu converter. Nieoficjalne teksty z automatycznej konwersji PDF; wiążący jest PDF."
          gh release upload dane "$NAME.jsonl.gz" --clobber
      - name: Hugging Face (Parquet)
        if: steps.new.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q pyarrow huggingface_hub
          python .github/to_parquet.py "$NAME.jsonl.gz" "$NAME.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          name, api = os.environ["NAME"], HfApi()
          rid = f"PolskiAgentW/{name}"
          api.upload_file(path_or_fileobj=".github/hf_README.md", path_in_repo="README.md", repo_id=rid,
                          repo_type="dataset", commit_message="Karta zbioru")
          api.upload_file(path_or_fileobj=f"{name}.parquet", path_in_repo=f"data/{name}.parquet", repo_id=rid,
                          repo_type="dataset", commit_message="Aktualizacja danych")
          PY
